<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Max Verstappen - Legends Never Die</title>
    <link rel="stylesheet" href="index.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Montserrat:wght@700;900&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <!-- Video Background -->
        <div class="video-container">
            <video id="mainVideo" class="video-layer" muted playsinline></video>
            <div class="overlay"></div>
        </div>

        <!-- Cinematic Effects -->
        <div class="vignette"></div>
        <div class="scanlines"></div>
        <div class="flash"></div>
        
        <!-- Text Overlays -->
        <div class="text-overlay">
            <h1 class="title" id="titleText">MAX VERSTAPPEN</h1>
            <p class="subtitle" id="subtitleText">LEGENDS NEVER DIE</p>
        </div>

        <!-- Stats Display -->
        <div class="stats" id="stats">
            <div class="stat-item">
                <span class="stat-number">3X</span>
                <span class="stat-label">WORLD CHAMPION</span>
            </div>
            <div class="stat-item">
                <span class="stat-number">54</span>
                <span class="stat-label">RACE WINS</span>
            </div>
            <div class="stat-item">
                <span class="stat-number">19</span>
                <span class="stat-label">CONSECUTIVE WINS</span>
            </div>
        </div>

        <!-- Quotes -->
        <div class="quote" id="quote">
            "SIMPLY LOVELY"
        </div>

        <!-- Controls -->
        <div class="controls">
            <button id="playBtn" class="control-btn">▶ PLAY EDIT</button>
            <button id="restartBtn" class="control-btn">↻ RESTART</button>
        </div>

        <!-- Audio -->
        <audio id="audio" src="https://cdn.pixabay.com/audio/2022/03/10/audio_d1718372d8.mp3"></audio>
    </div>

    <script src="script.js"></script>
</body>
</html>
