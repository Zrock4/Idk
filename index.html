<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>F1 3D Presentation - Formula 1 Experience</title>
    <link rel="stylesheet" href="index.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Rajdhani:wght@300;400;600;700&family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
</head>
<body>
    <div id="container">
        <!-- 3D Canvas -->
        <canvas id="canvas3d"></canvas>
        
        <!-- UI Overlay -->
        <div class="ui-overlay">
            <!-- Title Section -->
            <div class="title-section">
                <h1 class="main-title">FORMULA 1</h1>
                <p class="subtitle">3D INTERACTIVE EXPERIENCE</p>
            </div>
            
            <!-- Info Panel -->
            <div class="info-panel">
                <div class="info-item">
                    <span class="info-label">TOP SPEED</span>
                    <span class="info-value" id="speed">372 KM/H</span>
                </div>
                <div class="info-item">
                    <span class="info-label">POWER</span>
                    <span class="info-value">1000 HP</span>
                </div>
                <div class="info-item">
                    <span class="info-label">0-100</span>
                    <span class="info-value">2.6 SEC</span>
                </div>
            </div>
            
            <!-- Stats Display -->
            <div class="stats-panel">
                <div class="stat-box">
                    <div class="stat-number">23</div>
                    <div class="stat-label">RACES</div>
                </div>
                <div class="stat-box">
                    <div class="stat-number">10</div>
                    <div class="stat-label">TEAMS</div>
                </div>
                <div class="stat-box">
                    <div class="stat-number">20</div>
                    <div class="stat-label">DRIVERS</div>
                </div>
            </div>
            
            <!-- Controls Info -->
            <div class="controls-info">
                <p>🖱️ DRAG TO ROTATE • SCROLL TO ZOOM</p>
                <p>⌨️ SPACE: AUTO-ROTATE • R: RESET VIEW</p>
            </div>
            
            <!-- Camera Presets -->
            <div class="camera-controls">
                <button class="cam-btn" data-view="front">FRONT</button>
                <button class="cam-btn" data-view="side">SIDE</button>
                <button class="cam-btn" data-view="top">TOP</button>
                <button class="cam-btn" data-view="cinematic">CINEMATIC</button>
            </div>
        </div>
        
        <!-- Loading Screen -->
        <div id="loading-screen">
            <div class="loader">
                <div class="loader-ring"></div>
                <div class="loader-ring"></div>
                <div class="loader-ring"></div>
            </div>
            <p class="loading-text">LOADING F1 EXPERIENCE...</p>
        </div>
    </div>
    
    <!-- Three.js Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
